server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: proxied to the api container (same pod / compose network).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Never cache the shell or the service worker files; hashed assets can be cached forever.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /ngsw.json { add_header Cache-Control "no-cache"; }
    location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
